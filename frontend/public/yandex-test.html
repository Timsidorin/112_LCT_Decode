<!DOCTYPE html>
<html>
<head>
    <title>Yandex Auth Test</title>
    <script src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-with-polyfills-latest.js"></script>
</head>
<body>
    <div id="yandex-auth-container"></div>
    <script>
        window.onload = () => {
            window.YaAuthSuggest.init(
                {
                    client_id: 'f21a2418a2754805ab378e1830ed8ea1',
                    response_type: 'token',
                    redirect_uri: 'http://localhost:8002/auth/yandex/callback'
                },
                window.location.origin,
                {
                    view: "button",
                    parentId: "yandex-auth-container",
                    buttonView: "icon",
                    buttonTheme: "light",
                    buttonSize: "l",
                    buttonBorderRadius: 28,
                }
            ).then(({handler}) => handler()).catch(console.error);
        };
    </script>
</body>
</html>
